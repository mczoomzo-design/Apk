name: Build APK

on:
  push:
  workflow_dispatch:   # allows manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # skip the obsolete 'tools' package (removed from the SDK -> sdkmanager error)

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APKs (standard + kiosk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleStandardDebug assembleKioskDebug --no-daemon

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-booth-apk
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error

      - name: Upload kiosk APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-booth-kiosk-apk
          path: android/app/build/outputs/apk/kiosk/debug/app-kiosk-debug.apk
          if-no-files-found: error
