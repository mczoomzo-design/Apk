[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photosearch"
version = "0.1.0"
description = "ระบบค้นหารูปงานอีเวนต์ด้วยเซลฟี (Google Drive + FastAPI + FAISS)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["photosearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
